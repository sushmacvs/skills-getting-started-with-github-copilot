<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple To-Do App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="todo-app">
      <h1>To-Do List</h1>
      <form id="todo-form" class="todo-form">
        <label for="todo-input" class="sr-only">New task</label>
        <input id="todo-input" type="text" placeholder="Add a new task" required />
        <button type="submit">Add</button>
      </form>

      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

      <p id="empty-state" class="empty-state">No tasks yet. Add one above.</p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
